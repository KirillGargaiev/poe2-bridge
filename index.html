<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoE2 bridge</title>
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #15171a; color: #ddd; }
  textarea { width: 100%; height: 60vh; box-sizing: border-box; background: #1f2226; color: #ddd; border: 1px solid #444; padding: 8px; }
  #status { margin-top: 8px; }
  .ok { color: #7bd88f; } .err { color: #ff6b6b; }
</style>
</head>
<body>
<textarea id="area" autofocus placeholder="Сюда вставляется текст предмета (Ctrl+V)"></textarea>
<div id="status">Готово</div>
<script>
  const area = document.getElementById('area');
  const status = document.getElementById('status');
  const topic = location.hash.slice(1);
  const setStatus = (text, cls) => { status.textContent = text; status.className = cls || ''; };
  const valid = /^[A-Za-z0-9_-]{8,64}$/.test(topic);
  if (!valid) setStatus('В адресе нет топика: откройте ссылку, которую печатает мост (…#poe2-…)', 'err');

  async function send(text) {
    if (!valid || !text) return;
    setStatus('Отправка…');
    try {
      const res = await fetch('https://ntfy.sh/' + topic, { method: 'POST', body: text });
      setStatus(res.ok ? 'Отправлено ' + new Date().toLocaleTimeString() : 'Ошибка ntfy: ' + res.status, res.ok ? 'ok' : 'err');
    } catch (e) {
      setStatus('Сеть: ' + e.message, 'err');
    }
  }

  area.addEventListener('paste', (e) => {
    e.preventDefault();
    send(e.clipboardData.getData('text/plain'));
    area.value = '';
  });
  const refocus = () => area.focus();
  window.addEventListener('focus', refocus);
  document.addEventListener('click', refocus);
  document.addEventListener('visibilitychange', refocus);
</script>
</body>
</html>
